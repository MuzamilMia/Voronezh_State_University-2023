<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Sorting</title>
    <link rel="stylesheet" href="./11.29.css">
</head>
<body>
    <h1>Sortable List</h1>
    
    <!-- Sort toggle -->
    <label for="sortToggle" class="button">Sort</label>
    <input type="checkbox" id="sortToggle" hidden>

    <div class="container">
        <div class="item" data-order="3">Charlie</div>
        <div class="item" data-order="1">Alice</div>
        <div class="item" data-order="2">Bob</div>
    </div>
</body>
</html>
