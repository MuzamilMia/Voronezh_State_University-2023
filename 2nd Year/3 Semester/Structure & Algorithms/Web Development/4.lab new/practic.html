<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="./style.css">
    <style>
        /* Default light theme variables */
        :root {
            --background-color: #ffffff;
            --text-color: #000000;
            --task-background: #f9f9f9;
            --button-color: #007BFF;
            --button-text-color: #ffffff;
        }

        /* Dark theme variables */
        [data-theme="dark"] {
            --background-color: #121212;
            --text-color: #ffffff;
            --task-background: #1e1e1e;
            --button-color: #4CAF50;
            --button-text-color: #ffffff;
        }

        /* Global styles using variables */
        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .task-tracker {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .columns {
            display: flex;
            gap: 20px;
        }

        .column {
            flex: 1;
            background-color: var(--task-background);
            padding: 10px;
            border-radius: 8px;
        }

        .task {
            margin-bottom: 10px;
            padding: 10px;
            background-color: var(--background-color);
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .avatar {
            border-radius: 50%;
        }

        .my-button {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .my-button:hover {
            opacity: 0.8;
        }

        /* Hidden radio buttons for theme toggle */
        input[name="theme"] {
            display: none;
        }

        /* Label styles for theme toggle */
        label {
            padding: 5px 10px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input#dark-theme:checked ~ .task-tracker {
            --background-color: #121212;
            --text-color: #ffffff;
            --task-background: #1e1e1e;
            --button-color: #4CAF50;
            --background-color: black;
        }

        input#light-theme:checked ~ .task-tracker {
            --background-color: #ffffff;
            --text-color: #000000;
            --task-background: #f9f9f9;
            --button-color: #007BFF;
            background-color: black;
        }
    </style>
</head>
<body>
    
<div>
    <!-- Theme Toggle -->
    <div class="controls">
        <input type="radio" name="theme" id="light-theme" checked>
        <label for="light-theme">Light</label>
        <input type="radio" name="theme" id="dark-theme">
        <label for="dark-theme">Dark</label>
    </div>
</div>

<div class="task-tracker">
    <!-- Task Columns -->
    <div class="columns">
        <!-- Selected Column -->
        <div class="column">
            <h2>Selected</h2>
            <div class="task task-type-story task-priority-high">
                <div class="task__user">
                    <img class="avatar" src="https://i.pravatar.cc/32?img=1" alt="Avatar 1">
                    <p><strong>Story 101:</strong> Implement Login</p>
                    <a href="./mytext.txt">
                        <button class="my-button">Details</button>
                    </a>
                </div>
            </div>
            <!-- Other tasks... -->
        </div>

        <!-- In Progress Column -->
        <div class="column">
            <h2>In Progress</h2>
            <div class="task">
                <div class="task__user">
                    <img class="avatar" src="https://i.pravatar.cc/32?img=2" alt="Avatar 2">
                    <p><strong>Task 201:</strong> Refactor Code</p>
                    <a href="./mytext.txt">
                        <button class="my-button">Details</button>
                    </a>
                </div>
            </div>
        </div>

        <!-- Testing Column -->
        <div class="column">
            <h2>Testing</h2>
            <div class="task">
                <div class="task__user">
                    <img class="avatar" src="https://i.pravatar.cc/32?img=3" alt="Avatar 3">
                    <p><strong>Bug 301:</strong> Fix Login Bug</p>
                    <a href="./mytext.txt">
                        <button class="my-button">Details</button>
                    </a>
                </div>
            </div>
        </div>

        <!-- Done Column -->
        <div class="column">
            <h2>Done</h2>
            <div class="task">
                <div class="task__user">
                    <img class="avatar" src="https://i.pravatar.cc/32?img=4" alt="Avatar 4">
                    <p><strong>Task 401:</strong> Finalize Branding</p>
                    <a href="./mytext.txt">
                        <button class="my-button">Details</button>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
