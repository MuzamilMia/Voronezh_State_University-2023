<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker - New Design</title>
  <link rel="stylesheet" href="./styelsfor1.css">
</head>
<body data-theme="light">

<div class="task-tracker">
  <div class="controls">
    <div>
      <input type="radio" name="theme" id="light-theme" checked onclick="document.body.dataset.theme = 'light'">
      <label for="light-theme">Light Theme</label>
      <input type="radio" name="theme" id="dark-theme" onclick="document.body.dataset.theme = 'dark'">
      <label for="dark-theme">Dark Theme</label>
    </div>
    <select>
      <option value="priority">Sort by Priority</option>
      <option value="type">Sort by Task Type</option>
    </select>
  </div>

  <div class="columns">
    <div class="column selected">
      <h2>Selected</h2>
      <div class="task" data-type="story" data-priority="highest">
        <div class="task__user">
          <img class="avatar" src="https://i.pravatar.cc/32?img=1" alt="Avatar 1">
          <p><strong>Story 101:</strong> Implement Login Functionality</p>
        </div>
        <button onclick="showModal()">Details</button>
      </div>
      <div class="no-task" style="display: none;">No tasks</div>
    </div>

    <div class="column in-progress">
      <h2>In Progress</h2>
      <div class="task" data-type="task" data-priority="high">
        <div class="task__user">
          <img class="avatar" src="https://i.pravatar.cc/32?img=2" alt="Avatar 2">
          <p><strong>Task 202:</strong> Create Homepage Layout</p>
        </div>
        <button onclick="showModal()">Details</button>
      </div>
    </div>

    <div class="column testing">
      <h2>Testing</h2>
      <div class="task" data-type="bug" data-priority="middle">
        <div class="task__user">
          <img class="avatar" src="https://i.pravatar.cc/32?img=3" alt="Avatar 3">
          <p><strong>Bug 303:</strong> Fix Footer Error</p>
        </div>
        <button onclick="showModal()">Details</button>
      </div>
    </div>

    <div class="column done">
      <h2>Done</h2>
      <div class="task" data-type="task" data-priority="lowest">
        <div class="task__user">
          <img class="avatar" src="https://i.pravatar.cc/32?img=4" alt="Avatar 4">
          <p><strong>Task 404:</strong> Update Contact Page</p>
        </div>
        <button onclick="showModal()">Details</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal Window -->
<div class="modal" id="task-modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <p>Detailed information about the task.</p>
  </div>
</div>

<script>
  function showModal() {
    document.getElementById('task-modal').style.display = 'block';
    if (document.body.dataset.theme === 'dark') {
      document.querySelector('.modal-content').classList.add('dark');
    }
  }

  function closeModal() {
    document.getElementById('task-modal').style.display = 'none';
    document.querySelector('.modal-content').classList.remove('dark');
  }
</script>

</body>
</html>
