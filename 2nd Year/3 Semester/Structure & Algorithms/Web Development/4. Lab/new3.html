\<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Task Tracker</title>
  <link rel="stylesheet" href="./stylenew3.css">
</head>
<body data-theme="light">

<div class="task-tracker">
  <div class="controls">
    <label>
      <input type="radio" name="theme" value="light" checked onclick="setTheme('light')"> Light Mode
    </label>
    <label>
      <input type="radio" name="theme" value="dark" onclick="setTheme('dark')"> Dark Mode
    </label>
  </div>

  <div class="columns">
    <!-- Selected Column -->
    <div class="column" id="selected">
      <h2>Selected</h2>
      <div class="task" data-type="story" data-priority="highest">
        <div class="task__user">
          <img src="https://i.pravatar.cc/32?img=1" alt="User Avatar" class="avatar">
          <p><strong>Story 101:</strong> Implement Login Functionality</p>
        </div>
        <button onclick="showModal()">Details</button>
      </div>
    </div>

    <!-- In Progress Column -->
    <div class="column" id="in-progress">
      <h2>In Progress</h2>
      <div class="task" data-type="task" data-priority="high">
        <div class="task__user">
          <img src="https://i.pravatar.cc/32?img=2" alt="User Avatar" class="avatar">
          <p><strong>Task 202:</strong> Create Homepage Layout</p>
        </div>
        <button onclick="showModal()">Details</button>
      </div>
    </div>

    <!-- Testing Column -->
    <div class="column" id="testing">
      <h2>Testing</h2>
      <div class="task" data-type="bug" data-priority="middle">
        <div class="task__user">
          <img src="https://i.pravatar.cc/32?img=3" alt="User Avatar" class="avatar">
          <p><strong>Bug 303:</strong> Fix Footer Error</p>
        </div>
        <button onclick="showModal()">Details</button>
      </div>
    </div>

    <!-- Done Column -->
    <div class="column" id="done">
      <h2>Done</h2>
      <div class="task" data-type="task" data-priority="lowest">
        <div class="task__user">
          <img src="https://i.pravatar.cc/32?img=4" alt="User Avatar" class="avatar">
          <p><strong>Task 404:</strong> Update Contact Page</p>
        </div>
        <button onclick="showModal()">Details</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="task-modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <p>Task details go here...</p>
  </div>
</div>

<script>
  function setTheme(theme) {
    document.body.dataset.theme = theme;
  }

  function showModal() {
    document.getElementById("task-modal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("task-modal").style.display = "none";
  }
</script>

</body>
</html>
