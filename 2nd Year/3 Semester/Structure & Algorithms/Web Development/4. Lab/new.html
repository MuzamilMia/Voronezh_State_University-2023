<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker - Новый дизайн</title>
  <style>
    /* Основные стили */
    :root {
      --background-light: #eaeff1;
      --background-dark: #2e2e38;
      --task-bg-light: #fff;
      --task-bg-dark: #3c3c47;
      --border-radius: 12px;
      --padding: 16px;
      --box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Темы */
    [data-theme="light"] {
      background-color: var(--background-light);
      color: #2e2e38;
    }

    [data-theme="dark"] {
      background-color: var(--background-dark);
      color: #eaeff1;
    }

    /* Основная структура */
    .task-tracker {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 2px solid #ccc;
    }

    .controls label {
      margin: 0 10px;
    }

    /* Колонки */
    .columns {
      display: flex;
      gap: 20px;
    }

    .column {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--background-light);
      border-radius: var(--border-radius);
      padding: var(--padding);
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: var(--box-shadow);
    }

    [data-theme="dark"] .column {
      background-color: var(--background-dark);
    }

    .column h2 {
      text-align: center;
      font-size: 1.2em;
      padding-bottom: 10px;
      border-bottom: 1px solid #ccc;
    }

    /* Задачи */
    .task {
      display: flex;
      flex-direction: column;
      background-color: var(--task-bg-light);
      padding: var(--padding);
      border-radius: var(--border-radius);
      margin-bottom: 15px;
      box-shadow: var(--box-shadow);
      transition: background-color 0.3s;
      position: relative;
    }

    [data-theme="dark"] .task {
      background-color: var(--task-bg-dark);
    }

    /* Цвета типов задач */
    .task[data-type="story"] {
      border-left: 6px solid #4caf50;
    }

    .task[data-type="task"] {
      border-left: 6px solid #2196f3;
    }

    .task[data-type="bug"] {
      border-left: 6px solid #f44336;
    }

    /* Приоритет */
    .task[data-priority="highest"]::before {
      content: "🔺 ";
      color: red;
    }

    .task[data-priority="lowest"]::before {
      content: "🔻 ";
      color: green;
    }

    /* Мобильный вид */
    @media (max-width: 600px) {
      .columns {
        flex-direction: column;
      }
    }

    /* Планшетный вид */
    @media (min-width: 600px) and (max-width: 1000px) {
      .columns {
        display: block;
      }
    }

    /* Десктопный вид */
    @media (min-width: 1000px) {
      .columns {
        display: flex;
      }
    }

    /* Модальное окно */
    .modal {
      display: none;
      position: fixed;
      z-index: 1;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    .modal-content {
      background-color: #fff;
      margin: 10% auto;
      padding: 20px;
      border-radius: 8px;
      width: 80%;
      position: relative;
    }

    .modal-content.dark {
      background-color: #444;
      color: #fff;
    }

    .close {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 24px;
      cursor: pointer;
    }
  </style>
</head>
<body data-theme="light">

<div class="task-tracker">
  <!-- Панель управления -->
  <div class="controls">
    <div>
      <input type="radio" name="theme" id="light-theme" checked onclick="document.body.dataset.theme = 'light'">
      <label for="light-theme">Светлая тема</label>
      <input type="radio" name="theme" id="dark-theme" onclick="document.body.dataset.theme = 'dark'">
      <label for="dark-theme">Темная тема</label>
    </div>
    <select>
      <option value="priority">Сортировать по приоритету</option>
      <option value="type">Сортировать по типу задачи</option>
    </select>
  </div>

  <!-- Колонки с задачами -->
  <div class="columns">
    <div class="column selected">
      <h2>Selected</h2>
      <div class="task" data-type="story" data-priority="highest">
        <p><strong>Story 101:</strong> Внедрение функции авторизации</p>
        <button onclick="showModal()">Подробнее</button>
      </div>
      <div class="no-task" style="display: none;">Нет задач</div>
    </div>

    <div class="column in-progress">
      <h2>In Progress</h2>
      <div class="task" data-type="task" data-priority="high">
        <p><strong>Task 202:</strong> Создание макета главной страницы</p>
        <button onclick="showModal()">Подробнее</button>
      </div>
    </div>

    <div class="column testing">
      <h2>Testing</h2>
      <div class="task" data-type="bug" data-priority="middle">
        <p><strong>Bug 303:</strong> Исправление ошибки в футере</p>
        <button onclick="showModal()">Подробнее</button>
      </div>
    </div>

    <div class="column done">
      <h2>Done</h2>
      <div class="task" data-type="task" data-priority="lowest">
        <p><strong>Task 404:</strong> Обновление страницы контактов</p>
        <button onclick="showModal()">Подробнее</button>
      </div>
    </div>
  </div>
</div>

<!-- Модальное окно -->
<div class="modal" id="task-modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <p>Подробная информация о задаче.</p>
  </div>
</div>

<script>
  function showModal() {
    document.getElementById('task-modal').style.display = 'block';
    if (document.body.dataset.theme === 'dark') {
      document.querySelector('.modal-content').classList.add('dark');
    }
  }

  function closeModal() {
    document.getElementById('task-modal').style.display = 'none';
    document.querySelector('.modal-content').classList.remove('dark');
  }
</script>

</body>
</html>
